<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P5M MKG</title>
<meta name="theme-color" content="#e8873d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P5M MKG">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --orange:#e8873d;
    --orange-dark:#c96f2a;
    --blue:#3d94c9;
    --bg:#f5f7f8;
    --card:#ffffff;
    --border:#e2e6e9;
    --text:#25313a;
    --text-mute:#8592a0;
    --hadir:#3a8f5c;
    --izin:#c98a1f;
    --sakit:#8a5fc9;
    --cuti:#3d94c9;
    --alfa:#c9403a;
    --off:#6b7280;
    --tidakhadir:#7a1f1f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--card);border-bottom:1px solid var(--border);border-top:4px solid var(--blue);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;gap:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:40px;height:40px;flex-shrink:0;}
  header h1{font-size:18px;margin:0;font-weight:600;}
  header .sub{font-size:12px;color:var(--text-mute);margin-top:2px;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 14px;font-size:13px;}
  .btn-ghost:hover{background:#f0efed;}
  .btn-primary{background:var(--orange);color:#fff;padding:10px 20px;font-size:14px;font-weight:600;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-primary:disabled{background:#d9c2ba;cursor:not-allowed;}

  main{max-width:880px;margin:0 auto;padding:20px 16px 150px;}
  .group-banner{background:#fff4e9;border:1px solid var(--orange);color:var(--orange-dark);font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:14px;}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .toolbar .btn-ghost{font-size:12px;padding:7px 12px;}
  .shift-select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;background:#fff;color:var(--text);}

  .list-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .section-header{padding:10px 16px;font-size:13px;font-weight:700;color:var(--orange-dark);background:#fff4e9;border-bottom:1px solid var(--border);}
  .section-header:first-child{border-top:none;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .row:last-child{border-bottom:none;}
  .row .num{width:22px;font-size:12px;color:var(--text-mute);flex-shrink:0;}
  .row .name{flex:1 1 auto;min-width:0;font-size:14px;font-weight:500;}
  .row .name .name-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .name .jabatan{font-size:11px;font-weight:400;color:var(--text-mute);white-space:normal;margin-top:1px;}
  .status-group{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
  .status-btn{padding:6px 10px;font-size:12px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text-mute);border-radius:7px;}
  .status-btn[data-status="HADIR"].active{background:var(--hadir);color:#fff;border-color:var(--hadir);}
  .status-btn[data-status="IZIN"].active{background:var(--izin);color:#fff;border-color:var(--izin);}
  .status-btn[data-status="SAKIT"].active{background:var(--sakit);color:#fff;border-color:var(--sakit);}
  .status-btn[data-status="CUTI"].active{background:var(--cuti);color:#fff;border-color:var(--cuti);}
  .status-btn[data-status="ALFA"].active{background:var(--alfa);color:#fff;border-color:var(--alfa);}
  .status-btn[data-status="OFF"].active{background:var(--off);color:#fff;border-color:var(--off);}
  .status-btn[data-status="TIDAK HADIR"].active{background:var(--tidakhadir);color:#fff;border-color:var(--tidakhadir);}

  .icon-toggle{width:26px;height:26px;flex-shrink:0;border:1px solid var(--border);background:#fff;border-radius:7px;color:var(--text-mute);font-size:13px;display:flex;align-items:center;justify-content:center;}
  .icon-toggle.has-value{border-color:var(--orange);color:var(--orange);}
  .extra-box{display:none;padding:0 16px 12px;border-bottom:1px solid var(--border);width:100%;}
  .extra-box.open{display:block;}
  .extra-box input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;margin-bottom:8px;}
  .extra-box input:last-child{margin-bottom:0;}
  .extra-box .label{font-size:11px;color:var(--text-mute);margin-bottom:3px;display:block;}

  .empty, .loading{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:13px;}

  .footer-bar{position:fixed;bottom:56px;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .footer-bar .summary{font-size:12px;color:var(--text-mute);}
  .footer-bar .summary b{color:var(--text);}

  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .toast.error{background:var(--alfa);}
  .toast.ok{background:var(--hadir);}

  .hidden{display:none !important;}

  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20;}
  .nav-btn{flex:1;background:transparent;border:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text-mute);font-weight:500;}
  .nav-btn .icon{font-size:18px;line-height:1;}
  .nav-btn.active{color:var(--orange);}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,24,28,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
  .modal-card{background:#fff;border-radius:16px;padding:28px 24px;max-width:380px;width:100%;text-align:center;}
  .modal-card .emoji{font-size:34px;margin-bottom:6px;}
  .modal-card h2{margin:0 0 4px;font-size:19px;}
  .modal-card .desc{font-size:13px;color:var(--text-mute);margin-bottom:20px;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;}
  .field select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);}
  .modal-card .btn-primary{width:100%;padding:12px;font-size:14px;margin-top:4px;}

  .history-item{padding:12px 16px;border-bottom:1px solid var(--border);}
  .history-item:last-child{border-bottom:none;}
  .history-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .history-name{font-size:14px;font-weight:600;}
  .history-time{font-size:11px;color:var(--text-mute);white-space:nowrap;}
  .history-meta{font-size:12px;color:var(--text-mute);margin-top:2px;}
  .history-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;margin-top:4px;}
  .history-badge.HADIR{background:var(--hadir);}
  .history-badge.IZIN{background:var(--izin);}
  .history-badge.SAKIT{background:var(--sakit);}
  .history-badge.CUTI{background:var(--cuti);}
  .history-badge.ALFA{background:var(--alfa);}
  .history-badge.OFF{background:var(--off);}
  .history-badge.TIDAK_HADIR{background:var(--tidakhadir);}

  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border);}
  .setting-row:last-child{border-bottom:none;}
  .setting-label{font-size:13px;color:var(--text-mute);}
  .setting-value{font-size:14px;font-weight:600;}
</style>
</head>

<script>
// =====================================================
// KONFIGURASI
// =====================================================
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbxuaezwNBTfbAd7fapaLBSHLwKHlCAlW2Q49_rXCo_8K3WmUewBZcjhCoVz1Fz--U74/exec"
};

// Per grup: apakah butuh Shift, apakah punya kolom Back Up (PIT saja)
const DEFAULT_SHIFTS = ["Shift Pagi", "Shift Malam"];
const GROUP_CONFIG = {
  "Driver DT":   { shift:true,  backup:false },
  "PIT 2C1":     { shift:true,  backup:true  },
  "PIT C1":      { shift:true,  backup:true  },
  "PIT EITA":    { shift:true,  backup:true  },
  "Workshop 01": { shift:false, backup:false },
  "Workshop 02": { shift:false, backup:false },
  "Workshop 03": { shift:true,  backup:false, shifts:["Shift Pagi","Shift Siang","Shift Malam"] },
  "Logistik":    { shift:true,  backup:false },
  "Admin":       { shift:false, backup:false },
  "Sampler":     { shift:true,  backup:false },
  "Fuel Man":    { shift:false, backup:false },
  "Kitchen":     { shift:false, backup:false },
  "LAB":         { shift:false, backup:false }
};
function configFor(group){
  const cfg = GROUP_CONFIG[group] || { shift:false, backup:false };
  return Object.assign({ shifts: DEFAULT_SHIFTS }, cfg);
}

const STORAGE_KEY = 'p5m_site2_selected_group';

let participants = []; // {nama, jabatan, status, catatan, backupNama, backupJabatan, backupCatatan}
let currentGroup = null;
let currentShift = '';
let skippedTodayCount = 0;
const STATUSES = ["HADIR","IZIN","SAKIT","CUTI","ALFA","OFF"];
const ADMIN_STATUSES = ["HADIR","IZIN","SAKIT","CUTI","ALFA","OFF","TIDAK HADIR"];
const openExtras = new Set();

function normalizeName_(s){ return String(s || '').trim().toUpperCase(); }
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=>{ t.className = 'toast'; }, 2500);
}
function todayLabel(){
  const d = new Date();
  return d.toLocaleDateString('id-ID', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
}
function updateGroupBanner(){
  document.getElementById('groupBannerName').textContent = currentGroup || '-';
  document.getElementById('historyGroupBannerName').textContent = currentGroup || '-';
}
function genId(){
  const bytes = new Uint8Array(4);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function formatTimestamp(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// ================= NAVIGASI TAB =================
function showView(view){
  ['absen','riwayat','pengaturan'].forEach(v=>{
    document.getElementById('view-'+v).classList.toggle('hidden', v !== view);
  });
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  document.getElementById('footerBar').classList.toggle('hidden', view !== 'absen');
  if(view === 'riwayat' && historyNeedsReload) loadHistory();
  if(view === 'pengaturan') document.getElementById('settingGroupValue').textContent = currentGroup || '-';
}
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> showView(btn.dataset.view));
});

// ================= ONBOARDING =================
async function initOnboarding(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    currentGroup = saved;
    updateGroupBanner();
    applyGroupUI();
    loadParticipants();
    return;
  }
  document.getElementById('onboardModal').classList.remove('hidden');
  try{
    const res = await fetch(`${CONFIG.API_URL}?action=getGroups`);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Gagal memuat grup');
    const select = document.getElementById('onboardGroupSelect');
    if(!data.groups || data.groups.length === 0){
      select.innerHTML = '<option value="">Belum ada grup di Master Data</option>';
      return;
    }
    select.innerHTML = '<option value="">-- Pilih Grup --</option>' +
      data.groups.map(g => `<option value="${g}">${g}</option>`).join('');
  }catch(err){
    showToast('Gagal memuat daftar grup: ' + err.message, 'error');
  }
}

function applyGroupUI(){
  const cfg = configFor(currentGroup);
  const select = document.getElementById('shiftSelect');
  select.classList.toggle('hidden', !cfg.shift);
  select.innerHTML = '<option value="">Pilih Shift...</option>' +
    cfg.shifts.map(s => `<option value="${s}">${s}</option>`).join('');
  currentShift = '';
  select.value = '';
}

document.getElementById('onboardGroupSelect').addEventListener('change', (e)=>{
  document.getElementById('onboardStartBtn').disabled = !e.target.value;
});
document.getElementById('onboardStartBtn').addEventListener('click', ()=>{
  const group = document.getElementById('onboardGroupSelect').value;
  if(!group) return;
  localStorage.setItem(STORAGE_KEY, group);
  currentGroup = group;
  historyLoadedOnce = false;
  historyNeedsReload = true;
  updateGroupBanner();
  applyGroupUI();
  document.getElementById('onboardModal').classList.add('hidden');
  loadParticipants();
});
document.getElementById('changeGroupBtn').addEventListener('click', ()=>{
  document.getElementById('pinInput').value = '';
  document.getElementById('pinModal').classList.remove('hidden');
  document.getElementById('pinInput').focus();
});
document.getElementById('pinCancelBtn').addEventListener('click', ()=>{
  document.getElementById('pinModal').classList.add('hidden');
});
function attemptChangeGroup(){
  const val = document.getElementById('pinInput').value;
  if(!val) return;
  const btn = document.getElementById('pinConfirmBtn');
  btn.disabled = true;
  btn.textContent = 'Memeriksa...';
  fetch(`${CONFIG.API_URL}?action=getPin`)
    .then(res => res.json())
    .then(data => {
      if(!data.ok) throw new Error(data.error || 'Gagal memeriksa sandi');
      if(val !== data.pin){ showToast('Sandi salah', 'error'); return; }
      document.getElementById('pinModal').classList.add('hidden');
      localStorage.removeItem(STORAGE_KEY);
      currentGroup = null;
      participants = [];
      updateGroupBanner();
      showView('absen');
      initOnboarding();
    })
    .catch(err => showToast('Gagal memeriksa sandi: ' + err.message, 'error'))
    .finally(() => { btn.disabled = false; btn.textContent = 'Konfirmasi'; });
}
document.getElementById('pinConfirmBtn').addEventListener('click', attemptChangeGroup);
document.getElementById('pinInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attemptChangeGroup(); });
document.getElementById('shiftSelect').addEventListener('change', (e)=>{ currentShift = e.target.value; updateSummary(); });

// ================= ABSEN (beranda) =================
async function loadParticipants(){
  const card = document.getElementById('listCard');
  card.innerHTML = '<div class="loading">Memuat data peserta...</div>';
  openExtras.clear();
  try{
    const [namesData, historyData] = await Promise.all([
      fetch(`${CONFIG.API_URL}?action=getNames&group=${encodeURIComponent(currentGroup)}`).then(r=>r.json()),
      fetch(`${CONFIG.API_URL}?action=getHistory&group=${encodeURIComponent(currentGroup)}&date=${encodeURIComponent(todayISO())}`).then(r=>r.json())
    ]);
    if(!namesData.ok) throw new Error(namesData.error || 'Gagal memuat data');

    const alreadyToday = new Set();
    if(historyData.ok && historyData.rows){
      historyData.rows.forEach(r => alreadyToday.add(normalizeName_(r.nama)));
    }

    const allParticipants = namesData.names.map(item => ({
      nama: item.nama, jabatan: item.jabatan || '',
      status: '', catatan: '',
      backupNama: '', backupJabatan: '', backupCatatan: ''
    }));
    skippedTodayCount = allParticipants.filter(p => alreadyToday.has(normalizeName_(p.nama))).length;
    participants = allParticipants.filter(p => !alreadyToday.has(normalizeName_(p.nama)));
    renderList();
  }catch(err){
    card.innerHTML = `<div class="empty">Gagal memuat data peserta.<br>${err.message}</div>`;
    showToast('Gagal memuat data peserta', 'error');
  }
}

function renderList(){
  const card = document.getElementById('listCard');
  const cfg = configFor(currentGroup);
  if(participants.length === 0){
    card.innerHTML = skippedTodayCount > 0
      ? '<div class="empty">Semua peserta di grup ini sudah mengisi absen hari ini.<br>Kalau ada yang salah input, ubah lewat tab Riwayat.</div>'
      : '<div class="empty">Tidak ada data peserta untuk grup ini di Master Data.</div>';
    updateSummary();
    return;
  }
  let lastJabatan = null;
  card.innerHTML = participants.map((p, i) => {
    const jab = (p.jabatan || '').trim();
    let header = '';
    if(jab !== lastJabatan){
      header = `<div class="section-header">${escapeHtml(jab || 'Lainnya')}</div>`;
      lastJabatan = jab;
    }
    return `${header}
    <div class="row" data-idx="${i}">
      <div class="num">${i+1}</div>
      <div class="name"><span class="name-text">${escapeHtml(p.nama)}</span>${p.jabatan ? `<div class="jabatan">${escapeHtml(p.jabatan)}</div>` : ''}</div>
      <button class="icon-toggle ${p.catatan ? 'has-value' : ''}" data-note-idx="${i}" title="Catatan">✎</button>
      ${cfg.backup ? `<button class="icon-toggle ${p.backupNama ? 'has-value' : ''}" data-backup-idx="${i}" title="Back Up">🔁</button>` : ''}
      <div class="status-group">
        ${STATUSES.map(s => `<button class="status-btn ${p.status===s?'active':''}" data-idx="${i}" data-status="${s}">${s}</button>`).join('')}
      </div>
    </div>
    <div class="extra-box${openExtras.has('note'+i) ? ' open' : ''}" data-note-box="${i}">
      <span class="label">Catatan</span>
      <input type="text" placeholder="Catatan (opsional)" value="${escapeHtml(p.catatan)}" data-note-field="${i}">
    </div>
    ${cfg.backup ? `
    <div class="extra-box${openExtras.has('backup'+i) ? ' open' : ''}" data-backup-box="${i}">
      <span class="label">Nama Back Up</span>
      <input type="text" placeholder="Nama pengganti" value="${escapeHtml(p.backupNama)}" data-backup-nama="${i}">
      <span class="label">Jabatan Back Up</span>
      <input type="text" placeholder="Jabatan pengganti" value="${escapeHtml(p.backupJabatan)}" data-backup-jabatan="${i}">
      <span class="label">Keterangan Back Up (alasan)</span>
      <input type="text" placeholder="Alasan back up" value="${escapeHtml(p.backupCatatan)}" data-backup-catatan="${i}">
    </div>` : ''}
  `;
  }).join('');

  card.querySelectorAll('.status-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.dataset.idx;
      participants[idx].status = btn.dataset.status;
      renderList();
    });
  });
  card.querySelectorAll('[data-note-idx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = btn.dataset.noteIdx;
      openExtras.has('note'+idx) ? openExtras.delete('note'+idx) : openExtras.add('note'+idx);
      card.querySelector(`[data-note-box="${idx}"]`).classList.toggle('open');
    });
  });
  card.querySelectorAll('[data-backup-idx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = btn.dataset.backupIdx;
      openExtras.has('backup'+idx) ? openExtras.delete('backup'+idx) : openExtras.add('backup'+idx);
      card.querySelector(`[data-backup-box="${idx}"]`).classList.toggle('open');
    });
  });
  card.querySelectorAll('[data-note-field]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ participants[+inp.dataset.noteField].catatan = inp.value; });
  });
  card.querySelectorAll('[data-backup-nama]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ participants[+inp.dataset.backupNama].backupNama = inp.value; });
  });
  card.querySelectorAll('[data-backup-jabatan]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ participants[+inp.dataset.backupJabatan].backupJabatan = inp.value; });
  });
  card.querySelectorAll('[data-backup-catatan]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ participants[+inp.dataset.backupCatatan].backupCatatan = inp.value; });
  });

  updateSummary();
}

function updateSummary(){
  const filled = participants.filter(p=>p.status).length;
  let label = `${participants.length} peserta &middot; <b>${filled}</b> sudah diisi`;
  if(skippedTodayCount > 0) label += ` &middot; ${skippedTodayCount} sudah absen hari ini (disembunyikan)`;
  document.getElementById('summaryLabel').innerHTML = label;
  const cfg = configFor(currentGroup);
  document.getElementById('saveBtn').disabled = filled === 0 || (cfg.shift && !currentShift);
}

document.getElementById('markAllHadir').addEventListener('click', ()=>{
  participants.forEach(p => { if(!p.status) p.status = 'HADIR'; });
  renderList();
});
document.getElementById('clearAll').addEventListener('click', ()=>{
  participants.forEach(p => { p.status=''; p.catatan=''; p.backupNama=''; p.backupJabatan=''; p.backupCatatan=''; });
  renderList();
});
document.getElementById('refreshBtn').addEventListener('click', ()=>{
  if(!currentGroup) return;
  const activeView = document.querySelector('.nav-btn.active').dataset.view;
  if(activeView === 'riwayat') loadHistory(); else loadParticipants();
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const cfg = configFor(currentGroup);
  if(cfg.shift && !currentShift){ showToast('Pilih Shift dulu', 'error'); return; }
  const toSave = participants.filter(p => p.status);
  if(toSave.length === 0) return;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  const now = new Date();
  const rows = toSave.map(p => ({
    idPeserta: genId(),
    timestamp: formatTimestamp(now),
    nama: p.nama,
    jabatan: p.jabatan || '',
    shift: cfg.shift ? currentShift : '',
    keterangan: p.status,
    catatan: p.catatan || '',
    namaBackUp: cfg.backup ? (p.backupNama || '') : '',
    jabatanBackUp: cfg.backup ? (p.backupJabatan || '') : '',
    keteranganBackUp: cfg.backup ? (p.backupCatatan || '') : ''
  }));

  try{
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveAttendance', group: currentGroup, rows })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Gagal menyimpan');
    if(data.skipped > 0){
      showToast(`Tersimpan ${data.saved} · ${data.skipped} dilewati (sudah absen hari ini)`, data.saved > 0 ? 'ok' : 'error');
    }else{
      showToast(`Berhasil menyimpan ${data.saved} absensi ke "${currentGroup}"`, 'ok');
    }
    const savedSet = new Set(toSave.map(p => p.nama));
    participants = participants.filter(p => !savedSet.has(p.nama));
    skippedTodayCount += toSave.length;
    renderList();
    if(data.saved > 0) historyNeedsReload = true;
  }catch(err){
    showToast('Gagal menyimpan: ' + err.message, 'error');
  }finally{
    btn.textContent = 'Simpan Semua';
    updateSummary();
  }
});

// ================= RIWAYAT =================
function todayISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function isoDaysAgo(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  const p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
const historyDateEl = document.getElementById('historyDateInput');
historyDateEl.value = todayISO();
historyDateEl.max = todayISO();
historyDateEl.min = isoDaysAgo(6);

let historyRowsCache = [];
let historyEdits = {};
let historyLoadedOnce = false;
let historyNeedsReload = true; // true = ada perubahan (baru absen/ganti grup) yang belum tercermin di tab Riwayat

async function loadHistory(){
  if(!currentGroup) return;
  const card = document.getElementById('historyCard');
  if(!historyLoadedOnce){
    card.innerHTML = '<div class="loading">Memuat riwayat...</div>';
  }
  const dateVal = document.getElementById('historyDateInput').value;
  const cfg = configFor(currentGroup);
  try{
    const res = await fetch(`${CONFIG.API_URL}?action=getHistory&group=${encodeURIComponent(currentGroup)}&date=${encodeURIComponent(dateVal)}`);
    const data = await res.json();
    historyLoadedOnce = true;
    historyNeedsReload = false;
    if(!data.ok){ card.innerHTML = `<div class="empty">${data.error || 'Gagal memuat riwayat'}</div>`; return; }
    if(!data.rows || data.rows.length === 0){ card.innerHTML = '<div class="empty">Belum ada riwayat absen pada tanggal ini.</div>'; return; }
    const filled = data.rows.filter(r => r.keterangan && r.keterangan.trim() !== '');
    if(filled.length === 0){ card.innerHTML = '<div class="empty">Belum ada riwayat absen pada tanggal ini.</div>'; return; }
    historyRowsCache = filled;
    historyEdits = {};
    filled.forEach((r,i)=>{ historyEdits[i] = { status: r.keterangan, catatan: r.catatan || '' }; });

    card.innerHTML = filled.map((r, i) => `
      <div class="history-item">
        <div class="history-top">
          <div class="history-name">${escapeHtml(r.nama)}</div>
          <div class="history-time">${escapeHtml(r.timestamp)}</div>
        </div>
        ${r.jabatan ? `<div class="history-meta">${escapeHtml(r.jabatan)}${r.shift ? ' · '+escapeHtml(r.shift) : ''}</div>` : ''}
        <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
          <span class="history-badge ${escapeHtml(r.keterangan.replace(/\s+/g,'_'))}">${escapeHtml(r.keterangan)}</span>
          <button class="btn-ghost" style="font-size:11px;padding:4px 10px;" data-hist-idx="${i}" data-hist-toggle>Ubah</button>
          <button class="btn-ghost" style="font-size:11px;padding:4px 10px;color:var(--alfa);border-color:var(--alfa);" data-hist-idx="${i}" data-hist-delete>Hapus</button>
        </div>
        ${r.catatan ? `<div class="history-meta">Catatan: ${escapeHtml(r.catatan)}</div>` : ''}
        ${cfg.backup && r.namaBackUp ? `<div class="history-meta">Back Up: ${escapeHtml(r.namaBackUp)}${r.jabatanBackUp ? ' ('+escapeHtml(r.jabatanBackUp)+')' : ''}${r.keteranganBackUp ? ' — '+escapeHtml(r.keteranganBackUp) : ''}</div>` : ''}
        <div class="extra-box" data-hist-edit="${i}" style="border-top:1px dashed var(--border);padding-top:10px;margin-top:8px;">
          <div class="status-group" style="margin-bottom:8px;">
            ${ADMIN_STATUSES.map(s => `<button class="status-btn hist-status-btn ${r.keterangan===s?'active':''}" data-hist-idx="${i}" data-status="${s}">${s}</button>`).join('')}
          </div>
          <input type="text" placeholder="Catatan (opsional)" value="${escapeHtml(r.catatan)}" data-hist-note="${i}">
          <div style="display:flex;gap:8px;">
            <button class="btn-primary hist-save-btn" style="padding:8px 14px;font-size:12px;" data-hist-idx="${i}">Simpan Perubahan</button>
            <button class="btn-ghost hist-cancel-btn" style="padding:8px 14px;font-size:12px;" data-hist-idx="${i}">Batal</button>
          </div>
        </div>
      </div>
    `).join('');

    card.querySelectorAll('[data-hist-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.histIdx;
        card.querySelector(`[data-hist-edit="${idx}"]`).classList.toggle('open');
      });
    });
    card.querySelectorAll('[data-hist-delete]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const idx = btn.dataset.histIdx;
        const row = historyRowsCache[idx];
        if(!confirm(`Hapus absensi ${row.nama}? Orang ini akan muncul lagi di Beranda untuk diinput ulang.`)) return;
        btn.disabled = true;
        btn.textContent = 'Menghapus...';
        try{
          const res3 = await fetch(CONFIG.API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'deleteAttendance', group: currentGroup, idPeserta: row.idPeserta,
              timestamp: row.timestamp, nama: row.nama
            })
          });
          const data3 = await res3.json();
          if(!data3.ok) throw new Error(data3.error || 'Gagal menghapus');
          showToast('Absensi dihapus, orang ini muncul lagi di Beranda', 'ok');
          loadHistory();
        }catch(err){
          showToast('Gagal menghapus: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Hapus';
        }
      });
    });
    card.querySelectorAll('.hist-status-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.histIdx;
        historyEdits[idx].status = btn.dataset.status;
        card.querySelectorAll(`.hist-status-btn[data-hist-idx="${idx}"]`).forEach(b=>{
          b.classList.toggle('active', b.dataset.status === historyEdits[idx].status);
        });
      });
    });
    card.querySelectorAll('[data-hist-note]').forEach(inp=>{
      inp.addEventListener('input', ()=>{ historyEdits[inp.dataset.histNote].catatan = inp.value; });
    });
    card.querySelectorAll('.hist-cancel-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.histIdx;
        const row = historyRowsCache[idx];
        historyEdits[idx] = { status: row.keterangan, catatan: row.catatan || '' };
        card.querySelector(`[data-hist-edit="${idx}"]`).classList.remove('open');
        card.querySelectorAll(`.hist-status-btn[data-hist-idx="${idx}"]`).forEach(b=>{
          b.classList.toggle('active', b.dataset.status === historyEdits[idx].status);
        });
        const inp = card.querySelector(`[data-hist-note="${idx}"]`);
        if(inp) inp.value = historyEdits[idx].catatan;
      });
    });
    card.querySelectorAll('.hist-save-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const idx = btn.dataset.histIdx;
        const row = historyRowsCache[idx];
        const edit = historyEdits[idx];
        if(!edit.status){ showToast('Pilih status terlebih dahulu', 'error'); return; }
        btn.disabled = true;
        btn.textContent = 'Menyimpan...';
        try{
          const res2 = await fetch(CONFIG.API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'updateAttendance', group: currentGroup, idPeserta: row.idPeserta,
              timestamp: row.timestamp, nama: row.nama, keterangan: edit.status, catatan: edit.catatan
            })
          });
          const data2 = await res2.json();
          if(!data2.ok) throw new Error(data2.error || 'Gagal menyimpan perubahan');
          showToast('Absensi berhasil diubah', 'ok');
          row.keterangan = edit.status;
          row.catatan = edit.catatan;
          loadHistory();
        }catch(err){
          showToast('Gagal mengubah: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Simpan Perubahan';
        }
      });
    });
  }catch(err){
    card.innerHTML = `<div class="empty">Gagal memuat riwayat.<br>${err.message}</div>`;
    showToast('Gagal memuat riwayat', 'error');
  }
}
document.getElementById('historyDateInput').addEventListener('change', loadHistory);

function buildHistoryReportText(){
  const dateVal = document.getElementById('historyDateInput').value;
  let tanggalLabel = dateVal;
  if(dateVal){
    const [y,m,d] = dateVal.split('-');
    tanggalLabel = new Date(+y, +m-1, +d).toLocaleDateString('id-ID', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  }
  const hadirList = historyRowsCache.filter(r => r.keterangan === 'HADIR');
  const nonHadirList = historyRowsCache.filter(r => r.keterangan !== 'HADIR');

  let text = `*Laporan Kehadiran P5M*\n\n👥 Grup: ${currentGroup}\n📅 Hari/Tanggal: ${tanggalLabel}\n⏰ Jam: \n📍 Lokasi : \n🧑 Dipimpin oleh: \n\n`;

  text += `*HADIR (${hadirList.length})*\n`;
  if(hadirList.length === 0){
    text += '-\n';
  }else{
    hadirList.forEach((r, i) => {
      const jab = r.jabatan ? ` (${r.jabatan})` : '';
      text += `${i+1}. ${r.nama}${jab}\n`;
    });
  }

  text += `\n*TIDAK HADIR (${nonHadirList.length})*\n`;
  if(nonHadirList.length === 0){
    text += '-\n';
  }else{
    nonHadirList.forEach((r, i) => {
      const jab = r.jabatan ? ` (${r.jabatan})` : '';
      const catatan = r.catatan ? ` - ${r.catatan}` : '';
      text += `${i+1}. ${r.nama}${jab}: ${r.keterangan}${catatan}\n`;
    });
  }

  text += `\nMateri P5M: `;
  text += `\n\nSafety First ⛑️👌🏻`;
  return text;
}

function copyTextFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}

document.getElementById('copyHistoryBtn').addEventListener('click', async ()=>{
  if(!historyRowsCache || historyRowsCache.length === 0){
    showToast('Belum ada riwayat untuk disalin', 'error');
    return;
  }
  const text = buildHistoryReportText();
  try{
    await navigator.clipboard.writeText(text);
    showToast('Riwayat disalin, siap tempel ke WA', 'ok');
  }catch(err){
    const ok = copyTextFallback(text);
    showToast(ok ? 'Riwayat disalin, siap tempel ke WA' : 'Gagal menyalin, coba lagi', ok ? 'ok' : 'error');
  }
});

initOnboarding();

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW register gagal:', err));
  });
